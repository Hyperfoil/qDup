# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Asciidoctor
        run: sudo gem install asciidoctor rouge
      - name: Build docs
        run: |
          mkdir -p _site
          # -R . keeps the docs/ prefix in the output so the ../docs/... links in the adoc files still resolve
          find docs -name '*.adoc' -print0 | xargs -0 asciidoctor -R . -D _site
          # the adoc sources link to other .adoc files, point them at the generated html
          find _site -name '*.html' -print0 | xargs -0 sed -i -E 's/(href="[^"#]*)\.adoc/\1.html/g'
          echo '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=docs/userguide.html">' > _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
